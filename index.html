<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Heures de Soline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            /* Dégradé girly rose poudré */
            background: linear-gradient(135deg, #fce3ec 0%, #ffe8e8 50%, #f3e7e9 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(236, 172, 194, 0.3);
        }
        .btn-pink {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #554348;
            transition: all 0.3s ease;
        }
        .btn-pink:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 154, 158, 0.4);
        }
        .btn-pink:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }
        .toast {
            position: fixed;
            top: 20px;
            right: -300px;
            transition: right 0.4s ease-in-out;
            z-index: 50;
        }
        .toast.show {
            right: 20px;
        }
    </style>
</head>
<body class="text-gray-800 pb-20">

    <!-- Notifications stylisées -->
    <div id="toast" class="toast glass rounded-lg px-6 py-3 border-l-4 border-pink-400 flex items-center gap-3">
        <i class="fas fa-heart text-pink-400"></i>
        <span id="toast-msg" class="font-medium text-sm text-gray-700">Message</span>
    </div>

    <div class="max-w-md mx-auto pt-8 px-4">
        
        <!-- En-tête -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-400 mb-2">
                Les Heures de Soline 🌸
            </h1>
            <p class="text-sm text-gray-500">Gère ton temps avec élégance</p>
        </div>

        <!-- Onglets -->
        <div class="flex rounded-full glass p-1 mb-6">
            <button onclick="switchTab('pointeuse')" id="tab-pointeuse" class="flex-1 py-2 rounded-full text-sm font-semibold bg-white/80 shadow text-pink-500 transition-all">Pointeuse</button>
            <button onclick="switchTab('rapports')" id="tab-rapports" class="flex-1 py-2 rounded-full text-sm font-semibold text-gray-500 hover:text-pink-400 transition-all">Rapports</button>
        </div>

        <!-- ONGLET : POINTEUSE -->
        <div id="view-pointeuse" class="space-y-6">
            <div class="glass rounded-2xl p-6">
                <div class="text-center mb-6">
                    <div id="current-date" class="text-gray-500 text-sm mb-1">...</div>
                    <div id="current-time" class="text-4xl font-light text-pink-600 tracking-wider">00:00:00</div>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <button id="btn-arrivee" onclick="action('arrivee')" class="btn-pink rounded-xl py-4 font-semibold flex flex-col items-center gap-2">
                        <i class="fas fa-sign-in-alt text-xl"></i> Arrivée
                    </button>
                    <button id="btn-pause" onclick="action('pause')" class="btn-pink rounded-xl py-4 font-semibold flex flex-col items-center gap-2" disabled>
                        <i class="fas fa-coffee text-xl"></i> Pause
                    </button>
                    <button id="btn-reprise" onclick="action('reprise')" class="btn-pink rounded-xl py-4 font-semibold flex flex-col items-center gap-2" disabled>
                        <i class="fas fa-play text-xl"></i> Reprise
                    </button>
                    <button id="btn-depart" onclick="action('depart')" class="btn-pink rounded-xl py-4 font-semibold flex flex-col items-center gap-2" disabled>
                        <i class="fas fa-sign-out-alt text-xl"></i> Départ
                    </button>
                </div>
                
                <button id="btn-fin" onclick="finJournee()" class="w-full bg-gradient-to-r from-purple-400 to-pink-400 text-white rounded-xl py-4 font-bold shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-2" disabled>
                    <i class="fas fa-check-circle"></i> Clôturer ma journée
                </button>
            </div>

            <div class="glass rounded-2xl p-6">
                <h3 class="font-semibold text-gray-700 mb-4 flex items-center gap-2">
                    <i class="fas fa-history text-pink-400"></i> Ton historique d'aujourd'hui
                </h3>
                <div id="daily-logs" class="space-y-3 max-h-48 overflow-y-auto pr-2 text-sm">
                    <div class="text-gray-400 italic text-center py-2">Aucun pointage pour le moment.</div>
                </div>
            </div>
        </div>

        <!-- ONGLET : RAPPORTS -->
        <div id="view-rapports" class="hidden space-y-6">
            <div class="glass rounded-2xl p-6">
                <h2 class="text-xl font-bold text-gray-700 mb-4">Ta Semaine en Cours</h2>
                
                <!-- Synthèse Semaine avec Majoration -->
                <div class="bg-white/50 rounded-xl p-4 mb-4 border border-pink-100">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-sm font-medium text-gray-600">Total effectué</span>
                        <span id="week-total" class="font-bold text-pink-600 text-lg">0h 00</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2 mb-4">
                        <div id="week-progress" class="bg-gradient-to-r from-pink-400 to-purple-400 h-2 rounded-full" style="width: 0%"></div>
                    </div>
                    
                    <div class="space-y-2 text-sm">
                        <div class="flex justify-between text-gray-600">
                            <span>Base normale (jusqu'à 35h)</span>
                            <span id="week-normal" class="font-medium">0h 00</span>
                        </div>
                        <div class="flex justify-between text-pink-500">
                            <span>Majoration 25% (36h à 43h)</span>
                            <span id="week-25" class="font-medium">0h 00</span>
                        </div>
                        <div class="flex justify-between text-purple-500">
                            <span>Majoration 50% (44h et +)</span>
                            <span id="week-50" class="font-medium">0h 00</span>
                        </div>
                    </div>
                </div>

                <h3 class="font-semibold text-gray-700 mb-3">Détail par jour</h3>
                <div id="history-list" class="space-y-3 max-h-64 overflow-y-auto">
                    <!-- Généré en JS -->
                </div>
            </div>
        </div>

    </div>

    <script>
        // === SÉCURITÉ LOCALSTORAGE (Anti-Crash) ===
        const storage = {
            get: (key) => {
                try { return JSON.parse(localStorage.getItem(key)); }
                catch (e) { console.warn("Mémoire locale inaccessible", e); return null; }
            },
            set: (key, value) => {
                try { localStorage.setItem(key, JSON.stringify(value)); }
                catch (e) { console.warn("Impossible de sauvegarder", e); }
            }
        };

        // === ÉTAT DE L'APPLICATION ===
        let state = storage.get('soline_state') || {
            status: 'attente', 
            logs: [],
            currentDateStr: new Date().toLocaleDateString('fr-FR')
        };
        let historyData = storage.get('soline_history') || [];

        // === INITIALISATION ===
        window.addEventListener('DOMContentLoaded', () => {
            checkMidnightReset();
            updateClock();
            setInterval(updateClock, 1000);
            setInterval(checkMidnightReset, 60000); // Vérifie chaque minute
            
            updateUI();
            showToast("Coucou Soline ! Prête pour ta journée ? 💕");
        });

        // === HORLOGE ===
        function updateClock() {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toLocaleTimeString('fr-FR');
            document.getElementById('current-date').innerText = now.toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }

        // === CHANGEMENT DE JOUR AUTO ===
        function checkMidnightReset() {
            const todayStr = new Date().toLocaleDateString('fr-FR');
            if (state.currentDateStr !== todayStr) {
                if (state.logs.length > 0 && state.status !== 'termine') {
                    if (state.status === 'travail') {
                        state.logs.push({ action: 'Départ automatique', time: new Date(state.currentDateStr.split('/').reverse().join('-') + 'T23:59:59').getTime() });
                    }
                    saveToHistory(state.currentDateStr, state.logs);
                }
                state = { status: 'attente', logs: [], currentDateStr: todayStr };
                saveState();
                updateUI();
                showToast("Nouvelle journée ! L'ancienne a été sauvegardée. 🌸");
            }
        }

        // === POINTEUSE ===
        function action(type) {
            const now = new Date().getTime();
            let actionName = '';

            switch(type) {
                case 'arrivee': state.status = 'travail'; actionName = 'Arrivée'; break;
                case 'pause': state.status = 'pause'; actionName = 'Pause'; break;
                case 'reprise': state.status = 'travail'; actionName = 'Reprise'; break;
                case 'depart': state.status = 'attente'; actionName = 'Départ'; break;
            }

            state.logs.push({ action: actionName, time: now });
            saveState();
            updateUI();
            showToast(`C'est noté : ${actionName} à ${new Date(now).toLocaleTimeString('fr-FR').slice(0,5)}`);
        }

        function finJournee() {
            if (state.status === 'travail') {
                showToast("⚠️ Tu dois d'abord cliquer sur Départ avant de clôturer !");
                return;
            }
            if (state.logs.length === 0) return;

            saveToHistory(state.currentDateStr, state.logs);
            state = { status: 'termine', logs: [], currentDateStr: new Date().toLocaleDateString('fr-FR') };
            saveState();
            updateUI();
            showToast("🌟 Journée clôturée avec succès !");
            switchTab('rapports'); 
        }

        // === CALCULS DU TEMPS ===
        function calculateTotalMs(logs) {
            let total = 0;
            let lastIn = null;

            logs.forEach(log => {
                if (log.action === 'Arrivée' || log.action === 'Reprise') {
                    lastIn = log.time;
                } else if ((log.action === 'Pause' || log.action === 'Départ' || log.action === 'Départ automatique') && lastIn) {
                    total += (log.time - lastIn);
                    lastIn = null;
                }
            });
            if (lastIn && state.currentDateStr === new Date().toLocaleDateString('fr-FR') && state.status === 'travail') {
                total += (new Date().getTime() - lastIn);
            }
            return total;
        }

        function formatTime(ms) {
            const totalMinutes = Math.floor(ms / 60000);
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            return `${hours}h ${minutes.toString().padStart(2, '0')}`;
        }

        // === GESTION MÉMOIRE ===
        function saveState() {
            storage.set('soline_state', state);
        }

        function saveToHistory(dateStr, logs) {
            const ms = calculateTotalMs(logs);
            historyData = historyData.filter(h => h.date !== dateStr);
            historyData.push({ date: dateStr, logs: logs, totalMs: ms });
            
            historyData.sort((a, b) => {
                const [da, ma, ya] = a.date.split('/');
                const [db, mb, yb] = b.date.split('/');
                return new Date(yb, mb-1, db) - new Date(ya, ma-1, da);
            });
            storage.set('soline_history', historyData);
        }

        // === MISE À JOUR VISUELLE ===
        function updateUI() {
            const btnArr = document.getElementById('btn-arrivee');
            const btnPau = document.getElementById('btn-pause');
            const btnRep = document.getElementById('btn-reprise');
            const btnDep = document.getElementById('btn-depart');
            const btnFin = document.getElementById('btn-fin');

            btnArr.disabled = true; btnPau.disabled = true; btnRep.disabled = true; btnDep.disabled = true; btnFin.disabled = true;

            if (state.status === 'attente') {
                btnArr.disabled = false;
                if (state.logs.length > 0) btnFin.disabled = false;
            } else if (state.status === 'travail') {
                btnPau.disabled = false; btnDep.disabled = false;
            } else if (state.status === 'pause') {
                btnRep.disabled = false;
            }

            const logsDiv = document.getElementById('daily-logs');
            if (state.logs.length === 0) {
                logsDiv.innerHTML = `<div class="text-gray-400 italic text-center py-2">Aucun pointage pour le moment.</div>`;
            } else {
                logsDiv.innerHTML = state.logs.map(l => {
                    const timeStr = new Date(l.time).toLocaleTimeString('fr-FR').slice(0, 5);
                    const icon = l.action.includes('Arrivée') || l.action.includes('Reprise') ? 'fa-arrow-right text-green-500' : 'fa-arrow-left text-pink-500';
                    return `<div class="flex justify-between items-center bg-white/40 p-2 rounded mb-2">
                        <span><i class="fas ${icon} mr-2 w-4"></i>${l.action}</span>
                        <span class="font-mono bg-white/60 px-2 py-1 rounded">${timeStr}</span>
                    </div>`;
                }).join('');
                
                const totalEnCoursMs = calculateTotalMs(state.logs);
                logsDiv.innerHTML += `<div class="mt-3 text-center font-bold text-pink-600 bg-white/50 p-2 rounded-lg">Total aujourd'hui : ${formatTime(totalEnCoursMs)}</div>`;
            }

            renderHistory();
        }

        // === RAPPORTS ===
        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            return Math.ceil((((d - new Date(Date.UTC(d.getUTCFullYear(),0,1))) / 86400000) + 1)/7);
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            if (historyData.length === 0) {
                list.innerHTML = `<div class="text-gray-400 italic text-center py-4">Historique vide.</div>`;
                return;
            }

            let weekTotalMs = 0;
            const currentWeek = getWeekNumber(new Date());
            
            list.innerHTML = historyData.map(item => {
                const [d, m, y] = item.date.split('/');
                const itemDate = new Date(y, m-1, d);
                if (getWeekNumber(itemDate) === currentWeek) weekTotalMs += item.totalMs;

                return `<div class="bg-white/60 p-3 rounded-xl shadow-sm border border-white flex justify-between items-center mb-3">
                    <div>
                        <div class="font-bold text-gray-700">${item.date}</div>
                    </div>
                    <div class="font-mono text-pink-600 font-bold bg-pink-100 px-3 py-1 rounded-lg">
                        ${formatTime(item.totalMs)}
                    </div>
                </div>`;
            }).join('');

            const totalHours = weekTotalMs / 3600000;
            let normalHours = Math.min(totalHours, 35);
            let hours25 = totalHours > 35 ? Math.min(totalHours - 35, 8) : 0;
            let hours50 = totalHours > 43 ? totalHours - 43 : 0;

            document.getElementById('week-total').innerText = formatTime(weekTotalMs);
            document.getElementById('week-normal').innerText = formatTime(normalHours * 3600000);
            document.getElementById('week-25').innerText = formatTime(hours25 * 3600000);
            document.getElementById('week-50').innerText = formatTime(hours50 * 3600000);
            document.getElementById('week-progress').style.width = `${Math.min((totalHours / 45) * 100, 100)}%`;
        }

        function switchTab(tab) {
            const pView = document.getElementById('view-pointeuse');
            const rView = document.getElementById('view-rapports');
            const pTab = document.getElementById('tab-pointeuse');
            const rTab = document.getElementById('tab-rapports');
            
            const activeClass = "flex-1 py-2 rounded-full text-sm font-semibold bg-white/80 shadow text-pink-500 transition-all";
            const inactiveClass = "flex-1 py-2 rounded-full text-sm font-semibold text-gray-500 hover:text-pink-400 transition-all";

            if (tab === 'pointeuse') {
                pView.classList.remove('hidden'); rView.classList.add('hidden');
                pTab.className = activeClass; rTab.className = inactiveClass;
            } else {
                pView.classList.add('hidden'); rView.classList.remove('hidden');
                rTab.className = activeClass; pTab.className = inactiveClass;
                renderHistory();
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
